# dsh-ui-rheostat bundle patch.
# `dsh plugin --profile desktop add D:\Desktop\dsh-effort-switcher` (or the
# upstream repo github:lemonorangeapple/dsh-effort-switcher) appends this
# package to dsh.profile.bundles and applies this insert.
# Remove any leftover profile-level mount of the same id to avoid double-mount.
- insert:
    - id: ui-rheostat
      name: dsh-ui-rheostat
